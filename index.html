<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Solfege Hero: Remastered</title>
  <style>
    :root {
      --bg: #090d1f;
      --card: #121933;
      --card2: #1b2550;
      --accent: #71f6ff;
      --good: #6bff8d;
      --bad: #ff6f91;
      --text: #ecf2ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 10% 10%, #2c3f94 0, #131a3d 36%, var(--bg) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      gap: 12px;
    }

    h1 {
      margin: 6px 0 0;
      font-size: clamp(1.4rem, 4vw, 2.4rem);
      letter-spacing: 0.5px;
      text-align: center;
    }

    .layout {
      width: min(1100px, 98vw);
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 12px;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.3);
    }

    .game-wrap { padding: 10px; position: relative; }

    canvas {
      width: 100%;
      max-width: 100%;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.2);
      display: block;
      background: linear-gradient(180deg, #52a3ff 0%, #8dd1ff 45%, #d6f1ff 100%);
    }

    .hud {
      position: absolute;
      top: 18px;
      left: 18px;
      background: rgba(8, 12, 24, 0.7);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 0.88rem;
      line-height: 1.35;
    }

    .sidebar {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row { display: flex; gap: 8px; flex-wrap: wrap; }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 700;
      cursor: pointer;
      color: #091220;
      background: linear-gradient(180deg, #8ce9ff, #71f6ff);
      transition: transform .15s ease, filter .2s ease;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.05); }
    button:active { transform: translateY(0); }

    .ghost { background: linear-gradient(180deg, #9fa7ff, #7486ff); color: white; }

    .status {
      min-height: 68px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 0.95rem;
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      font-size: 0.78rem;
    }

    .legend span {
      text-align: center;
      border-radius: 8px;
      color: #0e1325;
      font-weight: 800;
      padding: 6px 0;
    }

    .touch {
      margin-top: 6px;
      display: none;
      gap: 10px;
      justify-content: center;
    }

    .touch button {
      width: 64px;
      height: 56px;
      border-radius: 14px;
      padding: 0;
      font-size: 1.2rem;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .touch { display: flex; }
    }
  </style>
</head>
<body>
  <h1>🎵 Solfege Hero: Remastered 🎮</h1>

  <section class="layout">
    <div class="card game-wrap">
      <canvas id="gameCanvas" width="900" height="470"></canvas>
      <div class="hud" id="hud"></div>
    </div>

    <aside class="card sidebar">
      <div><strong>Massive remake goals:</strong> polished visuals, cleaner architecture, and a full level campaign.</div>

      <div class="row">
        <button id="startBtn">Start / Continue</button>
        <button id="hintBtn" class="ghost">Replay Melody</button>
      </div>
      <div class="row">
        <button id="restartLevelBtn" class="ghost">Restart Level</button>
        <button id="resetRunBtn" class="ghost">Reset Full Run</button>
      </div>

      <div class="status" id="status"></div>

      <div><strong>Controls:</strong> ← → to move, Space / ↑ to jump. Land on pads in melody order.</div>

      <div class="legend" id="legend"></div>

      <div><strong>Levels:</strong> 8 handcrafted levels with increasing melody length, speed, and movement challenge.</div>
    </aside>
  </section>

  <div class="touch" id="touchControls">
    <button id="leftBtn">◀</button>
    <button id="jumpBtn">▲</button>
    <button id="rightBtn">▶</button>
  </div>

  <script>
    const NOTE_BANK = {
      C: { freq: 261.63, color: '#ff5f73', solfege: 'Do' },
      D: { freq: 293.66, color: '#ffa942', solfege: 'Re' },
      E: { freq: 329.63, color: '#ffe35f', solfege: 'Mi' },
      F: { freq: 349.23, color: '#71f58f', solfege: 'Fa' },
      G: { freq: 392.0, color: '#6cb8ff', solfege: 'Sol' },
      A: { freq: 440.0, color: '#9a87ff', solfege: 'La' },
      B: { freq: 493.88, color: '#d77dff', solfege: 'Ti' },
      c: { freq: 523.25, color: '#ff89a6', solfege: 'Do↑' }
    };

    const LEVELS = [
      { name: 'Warmup Meadow', song: 'Do Re Mi', tempo: 520, mistakesAllowed: 4, sequence: 'C D E D C'.split(' '), moving: false },
      { name: 'Bridge of Echoes', song: 'Small Steps', tempo: 470, mistakesAllowed: 4, sequence: 'E F G F E D'.split(' '), moving: false },
      { name: 'Skyline Etude', song: 'Rising Arc', tempo: 440, mistakesAllowed: 3, sequence: 'C E G A G E D'.split(' '), moving: true },
      { name: 'Crystal Pass', song: 'Mirror Walk', tempo: 410, mistakesAllowed: 3, sequence: 'G E F D E C D'.split(' '), moving: true },
      { name: 'Clocktower Sync', song: 'Pulse Trial', tempo: 390, mistakesAllowed: 3, sequence: 'C D E G E D C G'.split(' '), moving: true },
      { name: 'Moonlit Garden', song: 'Lullaby Twist', tempo: 370, mistakesAllowed: 2, sequence: 'E D C E G A G E'.split(' '), moving: true },
      { name: 'Storm Conservatory', song: 'Wind Pattern', tempo: 350, mistakesAllowed: 2, sequence: 'G A B c B A G E D'.split(' '), moving: true },
      { name: 'Finale: Hero Anthem', song: 'Grand Cadence', tempo: 330, mistakesAllowed: 2, sequence: 'C E G c B A G E F D C'.split(' '), moving: true }
    ];

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const statusEl = document.getElementById('status');
    const legendEl = document.getElementById('legend');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const state = {
      running: false,
      levelIndex: 0,
      score: 0,
      combo: 0,
      bestCombo: 0,
      sequenceIndex: 0,
      mistakes: 0,
      startedListening: false,
      message: 'Press Start to begin the campaign.',
      particles: []
    };

    const input = { left: false, right: false, jumpQueued: false };

    const world = {
      gravity: 0.6,
      groundY: canvas.height - 60,
      cameraShake: 0,
      stars: Array.from({ length: 35 }, () => ({ x: Math.random() * canvas.width, y: Math.random() * 160, r: Math.random() * 2 + 1 })),
      hills: Array.from({ length: 4 }, (_, i) => ({ x: i * 260, h: 100 + Math.random() * 50 }))
    };

    const player = {
      x: 80, y: 200, w: 40, h: 54,
      vx: 0, vy: 0,
      speed: 4.1,
      jump: -12,
      grounded: false,
      facing: 1,
      lastTouchedPad: null
    };

    let pads = [];
    let melodyLocked = false;

    function createPads() {
      const noteKeys = Object.keys(NOTE_BANK);
      const count = 8;
      pads = Array.from({ length: count }, (_, i) => {
        const note = noteKeys[i];
        return {
          x: 80 + i * 95,
          y: world.groundY - 30 - (i % 2 ? 20 : 0),
          w: 72,
          h: 22,
          note,
          activePulse: 0,
          movementPhase: Math.random() * Math.PI * 2
        };
      });
    }

    function currentLevel() {
      return LEVELS[state.levelIndex];
    }

    function playTone(note, duration = 260, volume = 0.18) {
      const meta = NOTE_BANK[note];
      if (!meta) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = meta.freq;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration / 1000);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration / 1000 + 0.02);
    }

    async function playMelody() {
      if (melodyLocked) return;
      const level = currentLevel();
      melodyLocked = true;
      state.message = `Listen: ${level.song}`;
      updateStatus();
      for (const note of level.sequence) {
        playTone(note, Math.max(130, level.tempo - 80), 0.16);
        flashPadsByNote(note);
        await new Promise(r => setTimeout(r, level.tempo));
      }
      state.startedListening = true;
      state.message = 'Your turn. Land on the pads in order!';
      melodyLocked = false;
      updateStatus();
    }

    function flashPadsByNote(note) {
      pads.forEach(p => {
        if (p.note === note) p.activePulse = 1;
      });
    }

    function setLevel(index, resetScore = false) {
      state.levelIndex = index;
      state.sequenceIndex = 0;
      state.mistakes = 0;
      state.combo = 0;
      state.startedListening = false;
      player.x = 80;
      player.y = 180;
      player.vx = 0;
      player.vy = 0;
      player.lastTouchedPad = null;
      if (resetScore) {
        state.score = 0;
        state.bestCombo = 0;
      }
      createPads();
      state.message = `Level ${index + 1}: ${currentLevel().name}`;
      updateStatus();
    }

    function updateStatus() {
      const lvl = currentLevel();
      const progress = `${state.sequenceIndex}/${lvl.sequence.length}`;
      hud.innerHTML = `
        <div><strong>Level:</strong> ${state.levelIndex + 1}/${LEVELS.length}</div>
        <div><strong>Song:</strong> ${lvl.song}</div>
        <div><strong>Score:</strong> ${state.score}</div>
        <div><strong>Combo:</strong> ${state.combo} (best ${state.bestCombo})</div>
        <div><strong>Mistakes:</strong> ${state.mistakes}/${lvl.mistakesAllowed}</div>
        <div><strong>Progress:</strong> ${progress}</div>
      `;
      statusEl.innerHTML = `<strong>${lvl.name}</strong><br>${state.message}`;
    }

    function spawnBurst(x, y, color) {
      for (let i = 0; i < 14; i++) {
        state.particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.8) * 5,
          life: 28 + Math.random() * 18,
          color
        });
      }
    }

    function landOnPad(pad) {
      if (player.lastTouchedPad === pad) return;
      player.lastTouchedPad = pad;
      playTone(pad.note, 190, 0.12);
      pad.activePulse = 1;

      if (!state.startedListening || melodyLocked) return;

      const expected = currentLevel().sequence[state.sequenceIndex];
      if (pad.note === expected) {
        state.sequenceIndex += 1;
        state.combo += 1;
        state.bestCombo = Math.max(state.bestCombo, state.combo);
        state.score += 100 + state.combo * 12;
        spawnBurst(pad.x + pad.w / 2, pad.y, NOTE_BANK[pad.note].color);
        if (state.sequenceIndex >= currentLevel().sequence.length) {
          state.score += 250;
          if (state.levelIndex < LEVELS.length - 1) {
            state.message = 'Level cleared! Press Start for next level.';
            state.running = false;
            setTimeout(() => setLevel(state.levelIndex + 1), 500);
          } else {
            state.message = `Campaign complete! Final score: ${state.score}`;
            state.running = false;
          }
        } else {
          state.message = `Great! Next note: ${currentLevel().sequence[state.sequenceIndex]}`;
        }
      } else {
        state.mistakes += 1;
        state.combo = 0;
        state.score = Math.max(0, state.score - 70);
        world.cameraShake = 8;
        state.message = `Oops! Expected ${expected}, heard ${pad.note}.`;
        if (state.mistakes > currentLevel().mistakesAllowed) {
          state.message = 'Too many mistakes. Restarting level...';
          state.running = false;
          setTimeout(() => {
            setLevel(state.levelIndex);
            playMelody();
          }, 700);
        }
      }
      updateStatus();
    }

    function updatePlayer() {
      if (!state.running) return;
      const accel = 0.7;
      if (input.left) { player.vx = Math.max(player.vx - accel, -player.speed); player.facing = -1; }
      if (input.right) { player.vx = Math.min(player.vx + accel, player.speed); player.facing = 1; }
      if (!input.left && !input.right) player.vx *= 0.82;

      if (input.jumpQueued && player.grounded) {
        player.vy = player.jump;
        player.grounded = false;
      }
      input.jumpQueued = false;

      player.vy += world.gravity;
      player.x += player.vx;
      player.y += player.vy;

      if (player.x < 0) player.x = 0;
      if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

      player.grounded = false;

      const floor = world.groundY;
      if (player.y + player.h >= floor) {
        player.y = floor - player.h;
        player.vy = 0;
        player.grounded = true;
        player.lastTouchedPad = null;
      }

      for (const pad of pads) {
        if (
          player.vy >= 0 &&
          player.x + player.w > pad.x &&
          player.x < pad.x + pad.w &&
          player.y + player.h <= pad.y + 8 &&
          player.y + player.h + player.vy >= pad.y
        ) {
          player.y = pad.y - player.h;
          player.vy = 0;
          player.grounded = true;
          landOnPad(pad);
        }
      }
    }

    function updateWorld() {
      const lvl = currentLevel();
      pads.forEach((p, i) => {
        p.activePulse = Math.max(0, p.activePulse - 0.05);
        if (lvl.moving) {
          p.movementPhase += 0.02 + i * 0.001;
          p.y += Math.sin(p.movementPhase) * 0.45;
          p.y = Math.min(world.groundY - 14, Math.max(world.groundY - 80, p.y));
        }
      });

      state.particles.forEach(pt => {
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.vy += 0.12;
        pt.life -= 1;
      });
      state.particles = state.particles.filter(p => p.life > 0);

      world.cameraShake *= 0.82;
    }

    function drawBackground() {
      ctx.fillStyle = '#102340';
      ctx.fillRect(0, 0, canvas.width, 130);
      world.stars.forEach(star => {
        ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(performance.now() * 0.002 + star.x) * 0.4})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = '#4f90da';
      world.hills.forEach((h, i) => {
        ctx.beginPath();
        ctx.ellipse(h.x + 120, canvas.height - 40, 180, h.h, 0, 0, Math.PI * 2);
        ctx.fill();
        h.x -= 0.2 + i * 0.02;
        if (h.x < -320) h.x = canvas.width + 40;
      });

      ctx.fillStyle = '#2c8a45';
      ctx.fillRect(0, world.groundY, canvas.width, canvas.height - world.groundY);
    }

    function drawPads() {
      pads.forEach(pad => {
        const note = NOTE_BANK[pad.note];
        const glow = pad.activePulse * 20;
        ctx.save();
        ctx.shadowBlur = glow;
        ctx.shadowColor = note.color;
        ctx.fillStyle = note.color;
        ctx.fillRect(pad.x, pad.y, pad.w, pad.h);
        ctx.fillStyle = '#091220';
        ctx.font = 'bold 18px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(pad.note, pad.x + pad.w / 2, pad.y + 16);
        ctx.restore();
      });
    }

    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
      ctx.scale(player.facing, 1);
      ctx.fillStyle = '#ffeff3';
      ctx.fillRect(-player.w / 2, -player.h / 2, player.w, player.h);
      ctx.fillStyle = '#ff6f91';
      ctx.fillRect(-player.w / 2, -player.h / 2, player.w, 12);
      ctx.fillStyle = '#222';
      ctx.fillRect(4, -8, 4, 4);
      ctx.fillRect(12, -8, 4, 4);
      ctx.restore();
    }

    function drawParticles() {
      state.particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / 35);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function drawSequenceHint() {
      const level = currentLevel();
      const visible = level.sequence.map((note, i) => i < state.sequenceIndex ? '✓' : note).join(' ');
      ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
      ctx.fillRect(12, canvas.height - 40, canvas.width - 24, 28);
      ctx.fillStyle = '#fff';
      ctx.font = '14px sans-serif';
      ctx.fillText(`Target: ${visible}`, 22, canvas.height - 21);
    }

    function render() {
      ctx.save();
      const shake = world.cameraShake;
      if (shake > 0.5) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }

      drawBackground();
      drawPads();
      drawPlayer();
      drawParticles();
      drawSequenceHint();
      ctx.restore();
    }

    function tick() {
      updatePlayer();
      updateWorld();
      render();
      requestAnimationFrame(tick);
    }

    function bindControls() {
      const down = e => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', ' '].includes(e.key)) e.preventDefault();
        if (e.key === 'ArrowLeft') input.left = true;
        if (e.key === 'ArrowRight') input.right = true;
        if (e.key === 'ArrowUp' || e.key === ' ') input.jumpQueued = true;
      };
      const up = e => {
        if (e.key === 'ArrowLeft') input.left = false;
        if (e.key === 'ArrowRight') input.right = false;
      };
      window.addEventListener('keydown', down);
      window.addEventListener('keyup', up);

      const bindTouch = (id, key, isJump = false) => {
        const el = document.getElementById(id);
        const press = (ev) => {
          ev.preventDefault();
          if (isJump) input.jumpQueued = true;
          else input[key] = true;
        };
        const release = (ev) => {
          ev.preventDefault();
          if (!isJump) input[key] = false;
        };
        el.addEventListener('touchstart', press, { passive: false });
        el.addEventListener('touchend', release, { passive: false });
        el.addEventListener('mousedown', press);
        el.addEventListener('mouseup', release);
        el.addEventListener('mouseleave', release);
      };

      bindTouch('leftBtn', 'left');
      bindTouch('rightBtn', 'right');
      bindTouch('jumpBtn', 'jumpQueued', true);
    }

    function setupUi() {
      document.getElementById('startBtn').addEventListener('click', async () => {
        await audioCtx.resume();
        if (!state.startedListening) {
          await playMelody();
        }
        state.running = true;
        state.message = 'Go! Follow the melody.';
        updateStatus();
      });

      document.getElementById('hintBtn').addEventListener('click', async () => {
        await audioCtx.resume();
        playMelody();
      });

      document.getElementById('restartLevelBtn').addEventListener('click', async () => {
        await audioCtx.resume();
        setLevel(state.levelIndex);
        playMelody();
      });

      document.getElementById('resetRunBtn').addEventListener('click', async () => {
        await audioCtx.resume();
        setLevel(0, true);
        playMelody();
      });

      const legendHtml = Object.entries(NOTE_BANK)
        .map(([n, meta]) => `<span style="background:${meta.color}">${n} · ${meta.solfege}</span>`)
        .join('');
      legendEl.innerHTML = legendHtml;
    }

    function init() {
      bindControls();
      setupUi();
      setLevel(0, true);
      updateStatus();
      tick();
    }

    init();
  </script>
</body>
</html>
